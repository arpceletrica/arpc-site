<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 70" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="arpcGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FACC15" />
      <stop offset="50%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
    <linearGradient id="arpcDarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="arpcSilverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <filter id="arpcGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ICON BADGE -->
  <g transform="translate(6, 5)">
    <!-- Hexagonal Outer Shield -->
    <path d="M30 2 L56 16 L56 44 L30 58 L4 44 L4 16 Z" 
          fill="url(#arpcDarkGrad)" 
          stroke="url(#arpcGoldGrad)" 
          stroke-width="2.5" 
          stroke-linejoin="round" />

    <!-- Inner Ambient Tech Circuit Lines -->
    <path d="M12 21 L24 21 L30 27" stroke="#EAB308" stroke-width="1.2" stroke-linecap="round" opacity="0.4" />
    <path d="M48 39 L36 39 L30 33" stroke="#EAB308" stroke-width="1.2" stroke-linecap="round" opacity="0.4" />
    
    <!-- Stylized Lightning Bolt with Precision Cuts -->
    <path d="M34 8 L18 31 L28 31 L24 52 L42 27 L31 27 Z" 
          fill="url(#arpcGoldGrad)" 
          filter="url(#arpcGlow)" />
          
    <path d="M33 11 L21 30 L29 30 L26 47 L39 28 L30 28 Z" 
          fill="#FEF08A" 
          opacity="0.6" />
  </g>

  <!-- BRAND NAME "ARPC" -->
  <text x="76" y="41" 
        font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', sans-serif" 
        font-size="34" 
        font-weight="900" 
        letter-spacing="1.5" 
        fill="url(#arpcSilverGrad)">
    A<tspan fill="url(#arpcGoldGrad)">R</tspan>PC
  </text>

  <!-- SUBTITLE "ELÉTRICA • WALLBOX" -->
  <text x="78" y="56" 
        font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', sans-serif" 
        font-size="10.5" 
        font-weight="700" 
        letter-spacing="3.5" 
        fill="#94A3B8">
    ELÉTRICA <tspan fill="#EAB308">•</tspan> WALLBOX
  </text>
  
  <!-- ACCENT DOT -->
  <circle cx="282" cy="38" r="3" fill="#EAB308" filter="url(#arpcGlow)" />
</svg>
